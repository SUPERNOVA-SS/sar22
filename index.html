<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص يوزرات روبلوكس الثلاثية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* القائمة الجانبية */
        .sidebar {
            width: 300px;
            background-color: #161b22;
            border-left: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .results-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
        }
        .results-list li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #21262d;
            border-radius: 4px;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid #2ea043;
        }
        /* محتوى الصفحة الرئيسي */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 30px;
            position: relative;
        }
        .status-box {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        /* الزر المطلوب أسفل القائمة/الشاشة */
        .start-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
        }
        .start-btn:hover {
            background-color: #2ea043;
        }
        .start-btn:disabled {
            background-color: #21262d;
            color: #484f58;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية لعرض اليوزرات -->
    <div class="sidebar">
        <h2>اليوزرات المتاحة</h2>
        <ul id="resultsList" class="results-list">
            <li style="color: #8b949e; border-right-color: #484f58;">لم يتم العثور على يوزرات بعد...</li>
        </ul>
    </div>

    <!-- المحتوى والزر أسفل القائمة / الشاشة -->
    <div class="main-content">
        <div class="status-box" id="statusText">الحالة: جاهز للبدء</div>
        <button id="startBtn" class="start-btn" onclick="startChecker()">بدء فحث اليوزرات الثلاثية</button>
    </div>

    <script>
        // توليد الحروف والأرقام المتاحة (حسب طلبك: أقل أحرف وأرقام ممكنة - يوزرات ثلاثية)
        const chars = "abcdefghijklmnopqrstuvwxyz0123456789_";
        
        // محاكاة سريعة جداً للفحص (نظرًا لقيود المتصفح والـ CORS مع سيرفرات روبلوكس)
        // ملاحظة: لربطها فعلياً بسيرفر روبلوكس، يجب تشغيل Node.js Backend كوسيط (Proxy)
        async function checkUsername(username) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // محاكاة عشوائية لنجاح الفحص (يتم استبدالها بطلب حقيقي للسيرفر)
                    // روبلوكس تقبل اليوزر الثلاثي المكون من أحرف وأرقام وشرطة سفلى إذا لم يكن مستخدماً
                    const isAvailable = Math.random() < 0.05; // 5% نسبة إيجاد يوزر متاح للتجربة
                    resolve(isAvailable);
                }, 50); // سرعة فائقة (50 ملي ثانية للبحث الواحد)
            });
        }

        async function startChecker() {
            const btn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');
            const resultsList = document.getElementById('resultsList');
            
            btn.disabled = true;
            btn.innerText =جاري البحث...;
            resultsList.innerHTML = ''; // تفريغ القائمة

            let foundCount = 0;

            // حلقة تكرارية لتوليد وفحص اليوزرات الثلاثية (3 خانات)
            for (let i = 0; i < chars.length; i++) {
                for (let j = 0; j < chars.length; j++) {
                    for (let k = 0; k < chars.length; k++) {
                        const username = chars[i] + chars[j] + chars[k];
                        
                        statusText.innerText = فحص اليوزر: ${username};

                        // فحص اليوزر في الخلفية بدون تعليق الواجهة (بفضل استخدام async/await)
                        const available = await checkUsername(username);

                        if (available) {
                            foundCount++;
                            if (foundCount === 1) {
                                resultsList.innerHTML = ''; // إزالة رسالة "لم يتم العثور"
                            }
                            
                            // إدراج اليوزر في القائمة مباشرة
                            const li = document.createElement('li');
                            li.innerHTML = `<span>${username}</span> <span style="color: #2ea043; font-size: 0.8rem;">متاح ✓</span>`;
                            resultsList.appendChild(li);
                        }

                        // توقف بسيط لمنع الضغط ولضمان عدم حدوث Freezing للمتصفح
                        if ((i * chars.length * chars.length + j * chars.length + k) % 50 === 0) {
                            await new Promise(r => setTimeout(r, 10));
                        }
                    }
                }
            }

            statusText.innerText = انتهى الفحص. تم العثور على ${foundCount} يوزر متاح.;
            btn.disabled = false;
            btn.innerText = إعادة البحث;
        }
    </script>
</body>
</html>
